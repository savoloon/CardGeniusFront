<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/short_card_genius_ai_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Genius AI</title>
    <script>
      (function() {
        var k = 'cardgenius-theme';
        var s = localStorage.getItem(k);
        var theme = (s === 'light' || s === 'dark') ? s : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
