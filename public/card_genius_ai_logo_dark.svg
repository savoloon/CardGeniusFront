<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180" fill="none">
  <defs>
    <!-- Более яркий градиент, хорошо читающийся на тёмном фоне -->
    <linearGradient id="brandGradient" x1="20" y1="20" x2="145" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="shineGradient" x1="45" y1="35" x2="125" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>

    <!-- Мягкое свечение вокруг знака -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.48
                0 1 0 0 0.25
                0 0 1 0 0.95
                0 0 0 0.32 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Знак -->
  <g filter="url(#logoGlow)">
    <rect x="18" y="18" width="144" height="144" rx="40" fill="url(#brandGradient)"/>

    <!-- Карточка товара -->
    <rect x="49" y="55" width="72" height="72" rx="16"
          stroke="white" stroke-width="8"/>

    <!-- Условное изображение товара -->
    <path d="M69 91L79 78L89 91L101 74L111 91"
          stroke="white" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M69 107H111"
          stroke="white" stroke-width="7"
          stroke-linecap="round"/>

    <!-- Большая AI-искра -->
    <path d="M128 34L133 47L146 52L133 57L128 70L123 57L110 52L123 47L128 34Z"
          fill="white"/>

    <!-- Маленькая искра -->
    <path d="M43 35L46 42L53 45L46 48L43 55L40 48L33 45L40 42L43 35Z"
          fill="url(#shineGradient)"/>

    <circle cx="139" cy="82" r="4" fill="white"/>
    <circle cx="35" cy="72" r="3" fill="white"/>
  </g>

  <!-- Название: светлое для тёмного интерфейса -->
  <text x="190" y="108"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="750"
        letter-spacing="-2.2"
        fill="#F8F7FF">Card</text>

  <text x="352" y="108"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="750"
        letter-spacing="-2.2"
        fill="#B57CFF">Genius</text>

  <text x="575" y="108"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="750"
        letter-spacing="-2.2"
        fill="#F8F7FF">AI</text>

  <!-- Дескриптор -->
  <text x="194" y="139"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="500"
        letter-spacing="3"
        fill="#B8B3C9">AI PRODUCT STUDIO</text>
</svg>
